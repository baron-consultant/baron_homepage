  </head>
  <body>
    <div class="wrap">
      <header id="header"></header>
      <main class="container inquiry-page sw-inquiry-page">
        <section class="inquiry-hero" aria-labelledby="sw-inquiry-title">
          <div class="inquiry-hero__copy">
            <p class="sw-inquiry-eyebrow">BARON SOFTWARE SUPPORT</p>
            <h1 id="sw-inquiry-title">S/W Q&amp;A</h1>
            <p>사용 중 궁금한 점과 개선 의견을 제품별 Q&amp;A에서 확인하고 문의하세요.</p>
          </div>
        </section>
        <section class="sw-inquiry-content" aria-labelledby="sw-inquiry-heading">
          <div class="sw-inquiry-intro">
            <h2 id="sw-inquiry-heading">어떤 제품에 대해 문의하시나요?</h2>
          </div>
          <div class="sw-inquiry-cards">
            <article class="sw-inquiry-card">
              <h3 class="sw-inquiry-card__logo"><img src="./egbim/img/egbim_k.svg" alt="EG-BIM" width="150" height="26" /></h3>
              <p class="sw-inquiry-card__description">BIM 모델과 EG-BIM 사용에 관한 질문과 답변을 확인하세요.</p>
              <a class="sw-inquiry-link" href="https://qa-test.baroncs.co.kr/egbim/" aria-label="EG-BIM Q&A 게시판으로 이동">문의하기 <span aria-hidden="true">→</span></a>
            </article>
            <article class="sw-inquiry-card sw-inquiry-card--coming-soon" data-coming-soon="오픈 예정입니다.">
              <h3 class="sw-inquiry-card__logo"><img src="./tova/img/tova_k.svg" alt="TOVA" width="104" height="26" /></h3>
              <p class="sw-inquiry-card__description">TOVA의 교통 수요 분석 기능과 사용 방법을 문의하세요.</p>
              <span class="inquiry-sr-only">현재 오픈 예정입니다.</span>
              <!-- 오픈 시 아래 버튼을 이 링크로 교체: <a class="sw-inquiry-link" href="/ko/inquiry.html#tova" aria-label="TOVA Q&A 게시판으로 이동">TOVA 문의하기 <span aria-hidden="true">→</span></a> -->
              <button type="button" class="sw-inquiry-link sw-inquiry-link--disabled" aria-label="TOVA Q&A 오픈 예정" disabled>오픈 예정</button>
            </article>
            <article class="sw-inquiry-card sw-inquiry-card--coming-soon" data-coming-soon="오픈 예정입니다.">
              <h3 class="sw-inquiry-card__logo"><img src="./gaia/img/gaia_k.svg" alt="GAIA" width="65" height="26" /></h3>
              <p class="sw-inquiry-card__description">GAIA의 지반 조사 및 분석 기능에 관한 문의를 남기세요.</p>
              <span class="inquiry-sr-only">현재 오픈 예정입니다.</span>
              <!-- 오픈 시 아래 버튼을 이 링크로 교체: <a class="sw-inquiry-link" href="/ko/inquiry.html#gaia" aria-label="GAIA Q&A 게시판으로 이동">GAIA 문의하기 <span aria-hidden="true">→</span></a> -->
              <button type="button" class="sw-inquiry-link sw-inquiry-link--disabled" aria-label="GAIA Q&A 오픈 예정" disabled>오픈 예정</button>
            </article>
          </div>
        </section>
      </main>
      <footer id="footer"></footer>
    </div>
  </body>
</html>
